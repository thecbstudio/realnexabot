<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget Özelleştirme — NexaBot Admin</title>
<style>
:root{--bg:#0d0d0d;--surface:#161616;--surface2:#1a1a1a;--border:#262626;--gold:#C9A84C;--text:#e8e8e8;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.head h1{font-size:24px;color:var(--gold)}
.nav{display:flex;gap:14px;font-size:13px}
.nav a{color:var(--muted);text-decoration:none}.nav a:hover{color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 480px;gap:24px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}
.panel h2{font-size:16px;margin-bottom:18px;color:var(--gold)}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
input,textarea,select{font:inherit;color:var(--text);background:#0a0a0a;border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;outline:none}
textarea{min-height:70px;resize:vertical}
button{font:inherit;background:var(--gold);color:#000;border:none;font-weight:600;cursor:pointer;border-radius:8px;padding:11px 22px}
button:hover{opacity:.9}
.color-row{display:flex;gap:10px;align-items:center}
.color-row input[type="color"]{width:50px;height:42px;padding:2px;cursor:pointer}
.color-row input[type="text"]{flex:1}
.preview{position:sticky;top:24px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;height:fit-content}
.preview h2{font-size:14px;margin-bottom:14px;color:var(--muted)}
.widget-preview{background:#0a0a0a;border:1px solid var(--border);border-radius:12px;overflow:hidden;width:100%;height:520px;display:flex;flex-direction:column}
.wp-head{padding:14px 16px;display:flex;gap:10px;align-items:center;color:#fff;font-weight:600}
.wp-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.wp-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#0d0d0d}
.wp-msg{padding:9px 13px;border-radius:14px;max-width:80%;font-size:14px;line-height:1.5}
.wp-msg.bot{background:#1a1a1a;color:#e8e8e8;align-self:flex-start;border-bottom-left-radius:4px}
.wp-msg.user{align-self:flex-end;border-bottom-right-radius:4px}
.wp-quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px}
.wp-quick button{font-size:12px;padding:6px 12px;background:transparent;border:1px solid var(--border);border-radius:999px;color:#888;cursor:pointer}
.wp-input{padding:14px;border-top:1px solid #222;display:flex;gap:8px}
.wp-input input{flex:1;font-size:13px}
.controls{display:flex;gap:10px;margin-top:20px}
.embed-block{background:#0a0a0a;border:1px solid var(--border);border-radius:8px;padding:14px;font-family:ui-monospace,monospace;font-size:12px;color:var(--gold);word-break:break-all;margin-top:8px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.preview{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🎨 Widget Özelleştirme</h1>
    <div class="nav">
      <a href="/admin">Admin</a> · <a href="/admin/test">Test</a> · <a href="/admin/analytics">Analytics</a> · <a href="/admin/kb">Bilgi Tabanı</a>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Bot Ayarları</h2>
      <label>İşletme</label>
      <select id="bizSelect" onchange="loadBiz()"></select>

      <label>Bot Adı</label>
      <input id="bot_name" placeholder="NexaBot">

      <label>Emoji / Avatar</label>
      <input id="emoji" maxlength="4" placeholder="🤖">

      <label>Logo / Avatar Resmi — herhangi boyutta yükle, sistem 256x256'ya küçültür — boşsa emoji kullanılır</label>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
        <div id="avatarPreview" style="width:48px;height:48px;border-radius:50%;background:#0a0a0a;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:24px">🤖</div>
        <input type="file" id="avatarFile" accept="image/*" style="flex:1" onchange="uploadAvatar()">
        <button type="button" onclick="document.getElementById('avatarFile').click()" style="padding:9px 14px">Seç</button>
      </div>

      <label>Karşılama Mesajı (Türkçe)</label>
      <textarea id="greeting" placeholder="👋 Merhaba! Size nasıl yardımcı olabilirim?"></textarea>

      <label>Karşılama Mesajı (İngilizce)</label>
      <textarea id="greeting_en" placeholder="👋 Hello! How can I help you?"></textarea>

      <label>Hızlı Cevaplar (virgülle ayır)</label>
      <input id="quick_replies" placeholder="Menü, Fiyatlar, Randevu, Saatler">

      <h2 style="margin-top:24px">Renkler</h2>
      <label>Ana Renk</label>
      <div class="color-row">
        <input type="color" id="widget_color" value="#C9A84C" oninput="syncColor()">
        <input type="text" id="widget_color_hex" value="#C9A84C" oninput="syncColorText()">
      </div>

      <label>Arka Plan</label>
      <div class="color-row">
        <input type="color" id="widget_bg" value="#0d0d0d" oninput="syncBg()">
        <input type="text" id="widget_bg_hex" value="#0d0d0d" oninput="syncBgText()">
      </div>

      <label>Konum</label>
      <select id="widget_position">
        <option value="bottom-right">Sağ Alt</option>
        <option value="bottom-left">Sol Alt</option>
      </select>

      <div class="controls"><span id="saveStatus" style="color:var(--muted);font-size:13px;align-self:center">Değişiklikleri otomatik kaydeder</span><button onclick="previewLive()" style="background:transparent;color:var(--text);border:1px solid var(--border)">🔍 Yeni Sekmede Aç</button></div>

      <h2 style="margin-top:32px">Sitenize Ekleyin</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:8px">Bu kodu sitenizin <code>&lt;/body&gt;</code> taginden hemen önce yapıştırın:</p>
      <div class="embed-block" id="embedCode">&lt;script src="..."&gt;&lt;/script&gt;</div>
    </div>

    <div class="preview">
      <h2>Canlı Önizleme</h2>
      <div class="widget-preview" id="preview">
        <div class="wp-head" id="pHead">
          <div class="wp-avatar" id="pAvatar">🤖</div>
          <div id="pName">Bot Adı</div>
        </div>
        <div class="wp-body">
          <div class="wp-msg bot" id="pGreeting">👋 Merhaba!</div>
          <div class="wp-msg user" id="pUser" style="background:var(--gold);color:#000">Fiyatlar nedir?</div>
        </div>
        <div class="wp-quick" id="pQuick"></div>
        <div class="wp-input"><input placeholder="Mesaj yaz..." readonly><button id="pSend" style="font-size:13px;padding:8px 14px">Gönder</button></div>
      </div>
    </div>
  </div>
</div>

<script>
const TOKEN = localStorage.getItem('nexa_admin_token');
if (!TOKEN) { alert('Önce admin\'den giriş yap'); location.href='/admin'; }
const $ = id => document.getElementById(id);
let businesses = [], currentBiz = null;

const api = (p, opts = {}) => fetch(p, { ...opts, headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) } }).then(r => r.json());

async function load() {
  businesses = await api('/api/businesses');
  $('bizSelect').innerHTML = businesses.map(b => `<option value="${b.id}">${b.name || b.id}</option>`).join('');
  if (businesses.length) loadBiz();
}

function loadBiz() {
  const id = $('bizSelect').value;
  currentBiz = businesses.find(b => b.id === id);
  if (!currentBiz) return;
  $('bot_name').value = currentBiz.bot_name || '';
  $('emoji').value = currentBiz.emoji || '🤖';
  $('greeting').value = currentBiz.greeting || '';
  $('greeting_en').value = currentBiz.greeting_en || '';
  $('quick_replies').value = (currentBiz.quick_replies || []).join(', ');
  $('widget_color').value = currentBiz.widget_color || '#C9A84C';
  $('widget_color_hex').value = currentBiz.widget_color || '#C9A84C';
  $('widget_bg').value = currentBiz.widget_bg || '#0d0d0d';
  $('widget_bg_hex').value = currentBiz.widget_bg || '#0d0d0d';
  $('widget_position').value = currentBiz.widget_position || 'bottom-right';
  updatePreview();
  refreshAvatarPreview();
  updateEmbed();
}

function updatePreview() {
  const color = $('widget_color').value;
  const bg = $('widget_bg').value;
  $('pHead').style.background = color;
  $('pHead').style.color = '#000';
  $('pAvatar').style.background = '#fff';
  $('pAvatar').textContent = $('emoji').value || '🤖';
  $('pName').textContent = $('bot_name').value || 'NexaBot';
  $('pGreeting').textContent = $('greeting').value || '👋 Merhaba!';
  $('preview').style.background = bg;
  document.querySelectorAll('#preview .wp-body').forEach(el => el.style.background = bg);
  $('pUser').style.background = color;
  $('pSend').style.background = color;
  $('pSend').style.color = '#000';
  const qr = $('quick_replies').value.split(',').map(s => s.trim()).filter(Boolean);
  $('pQuick').innerHTML = qr.slice(0, 4).map(q => `<button>${q}</button>`).join('');
}


let saveTimer = null;
function scheduleAutoSave() {
  if (!currentBiz) return;
  clearTimeout(saveTimer);
  document.getElementById('saveStatus').textContent = '⏳ Kaydediliyor...';
  document.getElementById('saveStatus').style.color = 'var(--gold)';
  saveTimer = setTimeout(async () => {
    await saveBiz(true);
    document.getElementById('saveStatus').textContent = '✓ Kaydedildi';
    document.getElementById('saveStatus').style.color = '#10b981';
    setTimeout(() => {
      document.getElementById('saveStatus').textContent = 'Otomatik kaydeder';
      document.getElementById('saveStatus').style.color = 'var(--muted)';
    }, 1500);
  }, 700);
}

['bot_name','emoji','greeting','greeting_en','quick_replies','widget_position'].forEach(id => $(id).addEventListener('input', () => { updatePreview(); scheduleAutoSave(); }));
['widget_color','widget_color_hex','widget_bg','widget_bg_hex','widget_position'].forEach(id => $(id).addEventListener('change', scheduleAutoSave));

function syncColor(){$('widget_color_hex').value=$('widget_color').value;updatePreview();}
function syncColorText(){const v=$('widget_color_hex').value;if(/^#[0-9a-f]{6}$/i.test(v)){$('widget_color').value=v;updatePreview();}}
function syncBg(){$('widget_bg_hex').value=$('widget_bg').value;updatePreview();}
function syncBgText(){const v=$('widget_bg_hex').value;if(/^#[0-9a-f]{6}$/i.test(v)){$('widget_bg').value=v;updatePreview();}}

function updateEmbed() {
  if (!currentBiz) return;
  const url = location.origin + '/embed/' + currentBiz.id;
  $('embedCode').textContent = `<script src="${url}"><\/script>`;
}

async function saveBiz(silent) {
  if (!currentBiz) return;
  const body = {
    businessId: currentBiz.id,
    bot_name: $('bot_name').value,
    emoji: $('emoji').value,
    greeting: $('greeting').value,
    greeting_en: $('greeting_en').value,
    quick_replies: $('quick_replies').value.split(',').map(s => s.trim()).filter(Boolean),
    widget_color: $('widget_color').value,
    widget_bg: $('widget_bg').value,
    widget_position: $('widget_position').value,
  };
  const r = await api('/api/business', { method: 'POST', body: JSON.stringify(body) });
  if (r.business) {
    currentBiz = { ...currentBiz, ...body };
    businesses = businesses.map(b => b.id === currentBiz.id ? currentBiz : b);
    if (!silent) alert('✓ Kaydedildi');
  } else if (!silent) alert('Hata: ' + JSON.stringify(r));
}

function previewLive() {
  if (currentBiz) window.open('/widget/' + currentBiz.id, '_blank', 'width=400,height=620');
}


async function uploadAvatar() {
  const f = document.getElementById('avatarFile').files[0];
  if (!f) return;
  if (!currentBiz) { alert('Önce işletme seç'); return; }
  if (f.size > 5 * 1024 * 1024) return alert(`Çok büyük: ${(f.size/1024/1024).toFixed(1)} MB. Max 5 MB.`);

  const ss = document.getElementById('saveStatus');
  ss.textContent = '⏳ Resim hazırlanıyor...'; ss.style.color = 'var(--gold)';

  try {
    const resizedBlob = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const src = Math.min(img.width, img.height);
        const sx = (img.width - src) / 2;
        const sy = (img.height - src) / 2;
        ctx.drawImage(img, sx, sy, src, src, 0, 0, size, size);
        canvas.toBlob(b => resolve(b), 'image/jpeg', 0.85);
      };
      img.onerror = () => reject(new Error('Resim okunamadı'));
      img.src = URL.createObjectURL(f);
    });

    const fd = new FormData();
    fd.append('file', new File([resizedBlob], 'avatar.jpg', { type: 'image/jpeg' }));

    ss.textContent = '⬆ Yükleniyor...';
    const r = await fetch(`/api/business/${currentBiz.id}/avatar`, { method:'POST', headers:{'Authorization':'Bearer '+TOKEN}, body: fd });
    const d = await r.json();
    if (d.ok) {
      businesses = await api('/api/businesses');
      currentBiz = businesses.find(b => b.id === currentBiz.id);
      refreshAvatarPreview();
      ss.textContent = '✓ Avatar yüklendi'; ss.style.color = '#10b981';
      setTimeout(() => { ss.textContent = 'Otomatik kaydeder'; ss.style.color = 'var(--muted)'; }, 2500);
    } else {
      ss.textContent = '✗ Hata: ' + (d.error || '?'); ss.style.color = '#dc2626';
    }
  } catch (e) {
    ss.textContent = '✗ Hata: ' + e.message; ss.style.color = '#dc2626';
  }
  document.getElementById('avatarFile').value = '';
}

function refreshAvatarPreview() {
  const el = document.getElementById('avatarPreview');
  if (currentBiz && currentBiz.avatar_url) {
    el.innerHTML = `<img src="${currentBiz.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  } else {
    el.innerHTML = ''; el.textContent = document.getElementById('emoji').value || '🤖';
  }
  const pa = document.getElementById('pAvatar');
  if (pa) {
    if (currentBiz && currentBiz.avatar_url) {
      pa.innerHTML = `<img src="${currentBiz.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
      pa.style.background = 'transparent';
    } else {
      pa.innerHTML = ''; pa.textContent = document.getElementById('emoji').value || '🤖';
      pa.style.background = '#fff';
    }
  }
}

load();
</script>
</body></html>
