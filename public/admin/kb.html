<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Base — NexaBot Admin</title>
<style>
:root{--bg:#0d0d0d;--surface:#161616;--border:#262626;--gold:#C9A84C;--text:#e8e8e8;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px;max-width:920px;margin:0 auto}
h1{font-size:24px;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:24px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;color:var(--gold);margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center}
input,textarea,select,button{font:inherit;color:var(--text);background:#0a0a0a;border:1px solid var(--border);border-radius:8px;padding:10px 12px;outline:none}
input,textarea,select{flex:1}
textarea{min-height:100px;resize:vertical;width:100%}
button{background:var(--gold);color:#000;border:none;font-weight:600;cursor:pointer;padding:10px 18px}
button:hover{opacity:.9}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
button.danger{background:#dc2626;color:#fff}
.sources{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.src{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0a0a0a;border:1px solid var(--border);border-radius:8px}
.src .name{font-weight:500}
.src .meta{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#222;font-size:11px;color:var(--gold);margin-right:6px;text-transform:uppercase}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--gold);padding:12px 18px;border-radius:8px;display:none}
.toast.show{display:block}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:10px 16px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-weight:500}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-content{display:none}
.tab-content.active{display:block}
</style>
</head>
<body>
<h1>🧠 Knowledge Base</h1>
<p class="sub">Bot'un öğrenmesini istediğin PDF, web sayfası veya metni yükle. Bot her cevapta bu bilgilerden yararlanır.</p>

<div class="card">
  <label>İşletme seç</label>
  <select id="bizSelect"></select>
</div>

<div class="card">
  <div class="tabs">
    <button class="tab active" data-tab="pdf">📄 PDF Yükle</button>
    <button class="tab" data-tab="url">🌐 Website URL</button>
    <button class="tab" data-tab="text">✏️ Düz Metin</button>
  </div>

  <div class="tab-content active" id="tab-pdf">
    <input type="file" id="pdfFile" accept="application/pdf">
    <div style="margin-top:12px"><button onclick="uploadPDF()">PDF Yükle</button></div>
  </div>

  <div class="tab-content" id="tab-url">
    <input id="urlInput" type="url" placeholder="https://siteniz.com/hakkimizda">
    <div style="margin-top:12px"><button onclick="uploadURL()">Web Sayfası Çek</button></div>
  </div>

  <div class="tab-content" id="tab-text">
    <input id="textName" placeholder="Kaynak adı (örn: SSS dökümanı)">
    <div style="height:8px"></div>
    <textarea id="textBody" placeholder="Bot'un öğrenmesini istediğin metni buraya yapıştır..."></textarea>
    <div style="margin-top:12px"><button onclick="uploadText()">Metin Ekle</button></div>
  </div>
</div>

<div class="card">
  <h2>Yüklü Kaynaklar</h2>
  <div class="sources" id="sources"><p style="color:var(--muted)">Bir işletme seç...</p></div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN = localStorage.getItem('nexa_admin_token');
if (!TOKEN) { alert('Önce /admin sayfasından giriş yap'); location.href='/admin'; }

const $ = id => document.getElementById(id);
const toast = msg => {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
};

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    $(`tab-${btn.dataset.tab}`).classList.add('active');
  };
});

const api = (path, opts={}) => fetch(path, {
  ...opts,
  headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json', ...(opts.headers||{}) }
}).then(r => r.json());

async function loadBusinesses() {
  const list = await api('/api/businesses');
  const sel = $('bizSelect');
  sel.innerHTML = list.map(b => `<option value="${b.id}">${b.name || b.id}</option>`).join('');
  sel.onchange = loadSources;
  if (list.length) loadSources();
}

async function loadSources() {
  const bizId = $('bizSelect').value;
  if (!bizId) return;
  const sources = await api(`/api/kb/${bizId}`);
  const wrap = $('sources');
  if (!sources.length) { wrap.innerHTML = '<p style="color:var(--muted)">Henüz kaynak yok.</p>'; return; }
  wrap.innerHTML = sources.map(s => `
    <div class="src">
      <div>
        <div class="name"><span class="badge">${s.source_type}</span>${s.source_name}</div>
        <div class="meta">${s.char_count.toLocaleString('tr-TR')} karakter • ${s.chunk_count} parça • ${new Date(parseInt(s.created_at)).toLocaleDateString('tr-TR')}</div>
      </div>
      <button class="danger" onclick="delSource(${s.id})">Sil</button>
    </div>
  `).join('');
}

async function delSource(id) {
  if (!confirm('Bu kaynağı silmek istiyor musun?')) return;
  const bizId = $('bizSelect').value;
  await fetch(`/api/kb/source/${id}/${bizId}`, { method:'DELETE', headers:{ 'Authorization':`Bearer ${TOKEN}` }});
  toast('Silindi'); loadSources();
}

async function uploadPDF() {
  const f = $('pdfFile').files[0];
  if (!f) return alert('PDF seç');
  const bizId = $('bizSelect').value;
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch(`/api/kb/upload-pdf/${bizId}`, { method:'POST', headers:{'Authorization':`Bearer ${TOKEN}`}, body: fd });
  const d = await r.json();
  if (d.ok) { toast(`PDF yüklendi: ${d.chunkCount} parça`); $('pdfFile').value=''; loadSources(); }
  else alert('Hata: '+(d.error||'?'));
}

async function uploadURL() {
  const url = $('urlInput').value.trim();
  if (!url) return alert('URL gir');
  const bizId = $('bizSelect').value;
  const d = await api(`/api/kb/upload-url/${bizId}`, { method:'POST', body: JSON.stringify({ url }) });
  if (d.ok) { toast(`Web sayfası çekildi: ${d.chunkCount} parça`); $('urlInput').value=''; loadSources(); }
  else alert('Hata: '+(d.error||'?'));
}

async function uploadText() {
  const text = $('textBody').value.trim();
  const name = $('textName').value.trim();
  if (!text) return alert('Metin gir');
  const bizId = $('bizSelect').value;
  const d = await api(`/api/kb/upload-text/${bizId}`, { method:'POST', body: JSON.stringify({ text, name }) });
  if (d.ok) { toast(`Metin eklendi: ${d.chunkCount} parça`); $('textBody').value=''; $('textName').value=''; loadSources(); }
  else alert('Hata: '+(d.error||'?'));
}

loadBusinesses();
</script>
</body></html>
