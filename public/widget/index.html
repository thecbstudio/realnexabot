<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
:root {
  --accent: #2563EB;
  --accent-hover: #1d4ed8;
  --accent-soft: rgba(37,99,235,0.10);
  --on-accent: #ffffff;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f3f4f6;
  --border: #e5e7eb;
  --ink: #0a0a0a;
  --muted: #6b7280;
  --faint: #9ca3af;
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
}
.chat-header {
  background: var(--accent);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
  overflow: hidden;
}
.header-info { flex: 1; min-width: 0; }
.bot-name {
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--on-accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bot-status {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.85);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
}
.status-dot {
  width: 6px; height: 6px;
  background: #4ade80;
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.powered { font-size: 0.62rem; color: rgba(255,255,255,0.6); flex-shrink: 0; }
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
  background: var(--bg);
}
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 5px; }
.msg { display: flex; flex-direction: column; max-width: 88%; }
.msg.bot { align-self: flex-start; }
.msg.user { align-self: flex-end; }
.bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 0.9rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.bot .bubble {
  background: var(--surface-2);
  color: var(--ink);
  border-bottom-left-radius: 4px;
}
.msg.user .bubble {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 500;
  border-bottom-right-radius: 4px;
}
.msg-time {
  font-size: 0.65rem;
  color: var(--faint);
  margin-top: 4px;
  padding: 0 4px;
}
.msg.user .msg-time { text-align: right; }
.typing-wrap { align-self: flex-start; }
.typing {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 12px 16px;
  background: var(--surface-2);
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  width: fit-content;
}
.dot {
  width: 6px; height: 6px;
  background: var(--faint);
  border-radius: 50%;
  animation: bounce 1.3s infinite;
}
.dot:nth-child(2) { animation-delay: .18s; }
.dot:nth-child(3) { animation-delay: .36s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
.quick-replies {
  padding: 4px 14px 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex-shrink: 0;
  background: var(--bg);
}
.qr-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--accent);
  padding: 7px 14px;
  border-radius: 100px;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
  font-family: inherit;
}
.qr-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.input-area {
  padding: 10px 12px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  background: var(--surface);
}
.chat-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--ink);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 0.9rem;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
  resize: none;
  max-height: 80px;
  min-height: 42px;
  line-height: 1.4;
}
.chat-input:focus { border-color: var(--accent); }
.chat-input::placeholder { color: var(--faint); }
.send-btn {
  background: var(--accent);
  color: var(--on-accent);
  border: none;
  width: 42px; height: 42px;
  border-radius: 10px;
  cursor: pointer;
  transition: background .2s, transform .1s;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  align-self: flex-end;
}
.send-btn:hover { background: var(--accent-hover); transform: scale(1.04); }
.send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.citations{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.citations .src{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:8px;border:1px solid var(--border);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<div class="chat-header">
  <div class="avatar" id="botAvatar">&#129302;</div>
  <div class="header-info">
    <div class="bot-name" id="botName">NexaBot</div>
    <div class="bot-status"><span class="status-dot"></span>&#199;evrimi&#231;i</div>
  </div>
  <div class="powered">NexaBot</div>
</div>

<div class="messages" id="messages"></div>
<div class="quick-replies" id="quickReplies"></div>

<div class="input-area">
  <textarea class="chat-input" id="chatInput" rows="1" placeholder="Mesaj yaz..."></textarea>
  <button class="send-btn" id="sendBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>

<script>
const businessId = window.location.pathname.split('/').filter(Boolean).pop();
localStorage.removeItem('nxbt_sid_' + businessId);
let sessionId = null;
let isTyping  = false;
let business  = null;

function contrastOn(hex) {
  try {
    let h = hex.replace('#','');
    if (h.length === 3) h = h.split('').map(x => x+x).join('');
    const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.6 ? '#0a0a0a' : '#ffffff';
  } catch { return '#ffffff'; }
}

async function loadBusiness() {
  if (!businessId || businessId === 'undefined') { initChat(); return; }
  try {
    const r = await fetch('/api/business/' + businessId);
    if (r.ok) {
      business = await r.json();
      document.getElementById('botName').textContent = business.bot_name || business.name || 'NexaBot';
      const avEl = document.getElementById('botAvatar');
      if (business.avatar_url) {
        avEl.innerHTML = '<img src="' + business.avatar_url + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">';
        avEl.style.background = 'transparent';
      } else {
        avEl.textContent = business.emoji || '\u{1F916}';
      }
      const root = document.documentElement.style;
      if (business.widget_color) {
        root.setProperty('--accent', business.widget_color);
        root.setProperty('--accent-soft', business.widget_color + '1A');
        root.setProperty('--on-accent', contrastOn(business.widget_color));
      }
      if (business.widget_bg) root.setProperty('--bg', business.widget_bg);
    }
  } catch(e) {}
  initChat();
}

function initChat() {
  appendMessage('bot', business?.greeting || '\u{1F44B} Merhaba! Size nasıl yardımcı olabilirim?');
  showQuickReplies(business?.quick_replies || []);
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function appendMessage(role, text, citations) {
  const msgs = document.getElementById('messages');
  const now  = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const div  = document.createElement('div');
  div.className = 'msg ' + role;
  const formatted = esc(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  let citeHtml = '';
  if (citations && citations.length) {
    const items = citations.map(s => {
      const isUrl = /^https?:\/\//.test(s);
      const icon = isUrl ? '\u{1F310}' : (s.toLowerCase().endsWith('.pdf') ? '\u{1F4C4}' : '\u{1F4DD}');
      const label = isUrl ? new URL(s).hostname : s;
      return '<span class="src">' + icon + ' ' + esc(label) + '</span>';
    }).join('');
    citeHtml = '<div class="citations">' + items + '</div>';
  }
  div.innerHTML = '<div class="bubble">' + formatted + '</div>' + citeHtml + '<div class="msg-time">' + now + '</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const el   = document.createElement('div');
  el.className = 'typing-wrap'; el.id = 'typingEl';
  el.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingEl');
  if (el) el.remove();
}

function showQuickReplies(arr) {
  const qr = document.getElementById('quickReplies');
  qr.innerHTML = '';
  (arr || []).forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = r;
    btn.onclick = () => { qr.innerHTML = ''; sendText(r); };
    qr.appendChild(btn);
  });
}

async function sendText(text) {
  if (!text.trim() || isTyping) return;
  document.getElementById('quickReplies').innerHTML = '';
  appendMessage('user', text);
  isTyping = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ businessId, sessionId, message: text })
    });
    const data = await r.json();
    sessionId = data.sessionId;
    localStorage.setItem('nxbt_sid_' + businessId, sessionId);
    removeTyping();
    appendMessage('bot', data.reply, data.citations);
    if (data.quickReplies && data.quickReplies.length) showQuickReplies(data.quickReplies);
  } catch(e) {
    removeTyping();
    appendMessage('bot', '⚠️ Bağlantı hatası. Lütfen tekrar deneyin.');
  }

  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('chatInput').focus();
}

document.getElementById('sendBtn').onclick = () => {
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (text) { input.value = ''; resize(input); sendText(text); }
};

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = e.target.value.trim();
    if (text) { e.target.value = ''; resize(e.target); sendText(text); }
  }
});

document.getElementById('chatInput').addEventListener('input', function() { resize(this); });

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

loadBusiness();
</script>
</body>
</html>
